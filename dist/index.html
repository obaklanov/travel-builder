<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your next trip starts here. Choose a destination and start planning with Travel Easy.">
  <meta name="theme-color" content="#241b13"><title>Travel Easy — Your next trip starts here</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="atlas-theme.css?v=about-1"><link rel="stylesheet" href="map-transition.css?v=egypt-nz-1"><script src="map-transition.js?v=egypt-nz-1" defer></script><script src="country-facts.js?v=egypt-nz-1" defer></script><script src="travel-details.js?v=egypt-nz-1" defer></script><script src="community-picks.js?v=egypt-nz-1" defer></script><script src="treasures.js?v=egypt-nz-1" defer></script><script src="app.js?v=budget-1" defer></script>
<link rel="stylesheet" href="clarity.css?v=planning-1">
<link rel="stylesheet" href="travel-easy.css?v=budget-2">
<script src="trip-start.js?v=budget-1" defer></script>
</head>
<body class="home-page">
<a class="skip" href="#main-content">Skip to content</a>
<header class="site-header wrap">
  <a class="brand" href="index.html" aria-label="Travel Easy home"><span>TRAVEL EASY</span></a>
  <nav aria-label="Main navigation"><a href="index.html" aria-current="page">Home</a><a href="destinations.html">Destinations</a><a href="profile.html" class="profile-nav">Profile</a></nav>
</header>
<main id="main-content">
  <section class="easy-hero" aria-labelledby="hero-title">
    <h1 id="hero-title">Your next trip<br>starts here.</h1>
    <p class="easy-intro">Choose a destination. Start planning.</p>
    <form id="destination-search" class="easy-search">
      <label for="destination">Where would you like to go?</label>
      <div class="easy-search-row"><select id="destination" required><option value="" disabled selected>Choose a country</option><option value="argentina">Argentina</option><option value="egypt">Egypt</option><option value="italy">Italy</option><option value="japan">Japan</option><option value="mexico">Mexico</option><option value="new-zealand">New Zealand</option><option value="portugal">Portugal</option><option value="thailand">Thailand</option></select></div>
      <div id="budget-field" class="easy-budget-field" hidden>
        <label for="trip-budget">What’s your total budget? (CAD)</label>
        <input id="trip-budget" name="budget" type="number" inputmode="decimal" list="budget-options" min="0.01" step="0.01" placeholder="Choose or type an amount" aria-describedby="budget-hint" required disabled>
        <datalist id="budget-options"><option value="500" label="$500"></option><option value="1000" label="$1,000"></option><option value="1500" label="$1,500"></option><option value="2000" label="$2,000"></option><option value="2500" label="$2,500"></option><option value="3000" label="$3,000"></option><option value="3500" label="$3,500"></option><option value="4000" label="$4,000"></option><option value="4500" label="$4,500"></option><option value="5000" label="$5,000"></option><option value="6000" label="$6,000"></option><option value="7000" label="$7,000"></option><option value="8000" label="$8,000"></option><option value="9000" label="$9,000"></option><option value="10000" label="$10,000"></option><option value="11000" label="$11,000"></option><option value="12000" label="$12,000"></option><option value="13000" label="$13,000"></option><option value="14000" label="$14,000"></option><option value="15000" label="$15,000"></option><option value="16000" label="$16,000"></option><option value="17000" label="$17,000"></option><option value="18000" label="$18,000"></option><option value="19000" label="$19,000"></option><option value="20000" label="$20,000"></option><option value="25000" label="$25,000"></option><option value="30000" label="$30,000"></option><option value="35000" label="$35,000"></option><option value="40000" label="$40,000"></option><option value="45000" label="$45,000"></option><option value="50000" label="$50,000"></option></datalist>
        <p id="budget-hint" class="easy-budget-hint">Select a suggested amount or enter your own.</p>
      </div>
      <button class="easy-plan-button" type="submit">Plan my trip</button>
      <p id="search-message" class="search-message" role="status"></p>
    </form>
  </section>
</main>
<dialog id="guide-dialog" aria-labelledby="guide-title"><button class="close-dialog" aria-label="Close destination starter">×</button><div class="guide-content"></div></dialog>
</body></html>
